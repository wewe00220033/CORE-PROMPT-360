name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene checks
        run: python3 scripts/verify_repo.py

      - name: Bash syntax check
        run: bash -n scripts/install.sh

      - name: Lock360 engine (selftest + eval)
        run: |
          python3 scripts/lock360.py --selftest
          python3 scripts/lock360.py eval

      - name: OpenCode round-trip (bash)
        run: |
          set -euo pipefail
          OC="$RUNNER_TEMP/oc"
          mkdir -p "$OC"
          printf '# my custom rules\n- keep me\n' > "$OC/AGENTS.md"
          printf '{"$schema":"https://opencode.ai/config.json","model":"x"}\n' > "$OC/opencode.json"
          cp "$OC/opencode.json" "$RUNNER_TEMP/opencode.json.orig"
          bash scripts/install.sh --opencode --opencode-root "$OC" --target "$RUNNER_TEMP/oc_gemini"
          test -f "$OC/skills/00-lock360-zero-gaps/SKILL.md"
          test -f "$OC/skills/00-lock360-zero-gaps/scripts/lock360.py"
          test -f "$OC/skills/00-lock360-zero-gaps/prompts/WEAK-MODEL-BOOSTER.md"
          test ! -f "$OC/skills/00-lock360-zero-gaps/scripts/verify_repo.py"
          grep -q 'keep me' "$OC/AGENTS.md"
          test "$(grep -c 'LOCK360_START' "$OC/AGENTS.md")" = "1"
          cmp "$OC/opencode.json" "$RUNNER_TEMP/opencode.json.orig"
          bash scripts/install.sh --uninstall --opencode --opencode-root "$OC" --target "$RUNNER_TEMP/oc_gemini"
          test ! -d "$OC/skills/00-lock360-zero-gaps"
          grep -q 'keep me' "$OC/AGENTS.md"
          test "$(grep -c 'LOCK360_START' "$OC/AGENTS.md" || true)" = "0"
          cmp "$OC/opencode.json" "$RUNNER_TEMP/opencode.json.orig"
          bash scripts/install.sh --uninstall --opencode --opencode-root "$OC" --target "$RUNNER_TEMP/oc_gemini"

      - name: Install round-trip (bash)
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/lock360"
          bash scripts/install.sh --all --target "$TARGET"
          test -f "$TARGET/config/skills/00-lock360-zero-gaps/SKILL.md"
          test -f "$TARGET/config/workflows/00-lock360-zero-gaps.md"
          python3 - "$TARGET/GEMINI.md" <<'PY'
          import sys
          txt = open(sys.argv[1], encoding="utf-8").read()
          s = txt.count("<!-- LOCK360_START -->")
          e = txt.count("<!-- LOCK360_END -->")
          print("markers after install: start=%d end=%d" % (s, e))
          sys.exit(0 if (s, e) == (1, 1) else 1)
          PY

      - name: Uninstall round-trip (bash)
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/lock360"
          bash scripts/install.sh --uninstall --target "$TARGET"
          test ! -d "$TARGET/config/skills/00-lock360-zero-gaps"
          test ! -f "$TARGET/config/workflows/00-lock360-zero-gaps.md"
          python3 - "$TARGET/GEMINI.md" <<'PY'
          import os, sys
          p = sys.argv[1]
          txt = open(p, encoding="utf-8").read() if os.path.isfile(p) else ""
          s = txt.count("<!-- LOCK360_START -->")
          e = txt.count("<!-- LOCK360_END -->")
          print("markers after uninstall: start=%d end=%d" % (s, e))
          sys.exit(0 if (s, e) == (0, 0) else 1)
          PY

      - name: Full skills-pack round-trip (bash)
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/lock360_pack"
          bash scripts/install.sh --all --with-pack --target "$TARGET"
          test -f "$TARGET/config/skills/00-lock360-zero-gaps/SKILL.md"
          test -f "$TARGET/config/skills/00-architect-sre/SKILL.md"
          test -f "$TARGET/config/skills/everything-search/SKILL.md"
          test -f "$TARGET/config/skills/egm-review/SKILL.md"
          test -f "$TARGET/config/skills/neon/SKILL.md"
          test -f "$TARGET/config/workflows/00-architect-sre.md"
          test -f "$TARGET/config/rules/arabic_keyboard_shortcuts.md"
          test -f "$TARGET/GEMINI.md"
          bash scripts/install.sh --uninstall --with-pack --target "$TARGET"
          test ! -d "$TARGET/config/skills/00-lock360-zero-gaps"
          test ! -d "$TARGET/config/skills/00-architect-sre"
          test ! -d "$TARGET/config/skills/neon"
          test ! -f "$TARGET/config/workflows/00-architect-sre.md"
          test ! -f "$TARGET/config/rules/arabic_keyboard_shortcuts.md"
          python3 - "$TARGET/GEMINI.md" <<'PY'
          import sys
          txt = open(sys.argv[1], encoding="utf-8").read()
          assert txt.count("<!-- LOCK360_START -->") == 0 and txt.count("<!-- LOCK360_END -->") == 0
          PY

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene checks (Windows, CRLF checkout of *.ps1)
        run: |
          $ErrorActionPreference = "Stop"
          python -X utf8 scripts\verify_repo.py
          if ($LASTEXITCODE -ne 0) { throw "verify_repo.py failed on Windows with $LASTEXITCODE" }

      - name: Lock360 engine (selftest + eval, Windows)
        run: |
          $ErrorActionPreference = "Stop"
          python -X utf8 scripts\lock360.py --selftest
          if ($LASTEXITCODE -ne 0) { throw "lock360 selftest failed" }
          python -X utf8 scripts\lock360.py eval
          if ($LASTEXITCODE -ne 0) { throw "lock360 eval failed" }

      - name: OpenCode round-trip (Windows PowerShell 5.1)
        run: |
          $ErrorActionPreference = "Stop"
          $oc = Join-Path $env:RUNNER_TEMP "oc"
          New-Item -ItemType Directory -Path $oc -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $oc "AGENTS.md"), "# my custom rules`n- keep me`n")
          $cfg = '{"$schema":"https://opencode.ai/config.json","model":"x"}'
          [System.IO.File]::WriteAllText((Join-Path $oc "opencode.json"), $cfg)
          $gem = Join-Path $env:RUNNER_TEMP "oc_gemini"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -OpenCode -OpenCodeRoot $oc -TargetRoot $gem
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -OpenCode exited with $LASTEXITCODE" }
          foreach ($rel in @("skills\00-lock360-zero-gaps\SKILL.md", "skills\00-lock360-zero-gaps\scripts\lock360.py", "skills\00-lock360-zero-gaps\prompts\WEAK-MODEL-BOOSTER.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $oc $rel))) { throw "missing: $rel" }
          }
          if (Test-Path -LiteralPath (Join-Path $oc "skills\00-lock360-zero-gaps\scripts\verify_repo.py")) { throw "verify_repo.py must not be installed" }
          $a = [System.IO.File]::ReadAllText((Join-Path $oc "AGENTS.md"))
          if ($a -notmatch "keep me") { throw "custom AGENTS.md line lost after install" }
          if (([regex]::Matches($a, "LOCK360_START")).Count -ne 1) { throw "expected one LOCK360 block" }
          if ([System.IO.File]::ReadAllText((Join-Path $oc "opencode.json")) -ne $cfg) { throw "opencode.json was modified" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -OpenCode -OpenCodeRoot $oc -TargetRoot $gem
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall -OpenCode exited with $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $oc "skills\00-lock360-zero-gaps")) { throw "OpenCode skill still present" }
          $a = [System.IO.File]::ReadAllText((Join-Path $oc "AGENTS.md"))
          if ($a -notmatch "keep me") { throw "custom AGENTS.md line lost after uninstall" }
          if ($a -match "LOCK360_START") { throw "LOCK360 block still present" }
          if ([System.IO.File]::ReadAllText((Join-Path $oc "opencode.json")) -ne $cfg) { throw "opencode.json was modified on uninstall" }

      - name: Install round-trip (Windows PowerShell 5.1)
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "lock360"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -All -TargetRoot $target
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $skill = Join-Path $target "config\skills\00-lock360-zero-gaps"
          if (-not (Test-Path -LiteralPath (Join-Path $skill "SKILL.md"))) { throw "skill folder missing: $skill" }
          if (-not (Test-Path -LiteralPath (Join-Path $target "config\workflows\00-lock360-zero-gaps.md"))) { throw "workflow file missing" }
          $txt = [System.IO.File]::ReadAllText((Join-Path $target "GEMINI.md"))
          $s = ([regex]::Matches($txt, [regex]::Escape("<!-- LOCK360_START -->"))).Count
          $e = ([regex]::Matches($txt, [regex]::Escape("<!-- LOCK360_END -->"))).Count
          Write-Host "markers after install: start=$s end=$e"
          if (($s -ne 1) -or ($e -ne 1)) { throw "expected exactly one LOCK360 marker pair" }

      - name: Uninstall round-trip (Windows PowerShell 5.1)
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "lock360"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -TargetRoot $target
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall exited with $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $target "config\skills\00-lock360-zero-gaps")) { throw "skill folder still present" }
          if (Test-Path -LiteralPath (Join-Path $target "config\workflows\00-lock360-zero-gaps.md")) { throw "workflow file still present" }
          $gem = Join-Path $target "GEMINI.md"
          $txt = ""
          if (Test-Path -LiteralPath $gem) { $txt = [System.IO.File]::ReadAllText($gem) }
          $s = ([regex]::Matches($txt, [regex]::Escape("<!-- LOCK360_START -->"))).Count
          $e = ([regex]::Matches($txt, [regex]::Escape("<!-- LOCK360_END -->"))).Count
          Write-Host "markers after uninstall: start=$s end=$e"
          if (($s -ne 0) -or ($e -ne 0)) { throw "expected zero LOCK360 markers after uninstall" }

      - name: Full skills-pack round-trip (Windows PowerShell 5.1)
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "lock360_pack"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -All -WithPack -TargetRoot $target
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -All -WithPack exited with $LASTEXITCODE" }
          foreach ($rel in @(
            "config\skills\00-lock360-zero-gaps\SKILL.md",
            "config\skills\00-architect-sre\SKILL.md",
            "config\skills\everything-search\SKILL.md",
            "config\skills\egm-review\SKILL.md",
            "config\skills\neon\SKILL.md",
            "config\workflows\00-architect-sre.md",
            "config\rules\arabic_keyboard_shortcuts.md",
            "GEMINI.md"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $rel))) { throw "missing installed pack item: $rel" }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -WithPack -TargetRoot $target
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall -WithPack exited with $LASTEXITCODE" }
          foreach ($rel in @(
            "config\skills\00-lock360-zero-gaps",
            "config\skills\00-architect-sre",
            "config\skills\neon",
            "config\workflows\00-architect-sre.md",
            "config\rules\arabic_keyboard_shortcuts.md"
          )) {
            if (Test-Path -LiteralPath (Join-Path $target $rel)) { throw "uninstalled pack item still present: $rel" }
          }
          $txt = [System.IO.File]::ReadAllText((Join-Path $target "GEMINI.md"))
          if (($txt -match [regex]::Escape("<!-- LOCK360_START -->")) -or ($txt -match [regex]::Escape("<!-- LOCK360_END -->"))) {
            throw "expected zero LOCK360 markers after pack uninstall"
          }
